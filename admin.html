<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin – Chnoua nattayeb</title>
<style>
:root{--bg:#f4f8fc;--ink:#12202f;--card:#fff;--line:#cfdcea;--blue:#1b5fae;--blue-ink:#fff;--red:#b3261e;--muted:#546579}
@media (prefers-color-scheme:dark){:root{--bg:#0c1b2e;--ink:#e8eff7;--card:#12283f;--line:#27405d;--blue:#5aa0ee;--blue-ink:#0c1b2e;--red:#ff7a68;--muted:#9db1c6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
main{max-width:900px;margin:0 auto;padding:20px}
h1{font-size:1.5rem;margin:.4em 0}
input{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;width:100%;min-width:0}
button{background:var(--blue);color:var(--blue-ink);border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font:inherit}
button.ghost,button.mv,button.del,button.grip{background:transparent;color:var(--ink);border:1px solid var(--line);padding:6px 10px}
button.del{color:var(--red)}
button.grip{cursor:grab;touch-action:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hide{display:none}
.cat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:14px 0;transition:box-shadow .15s}
.cat.over{box-shadow:0 0 0 3px var(--blue)}
.cat.dragging,.row.dragging{opacity:.4}
.chead,.row{display:grid;grid-template-columns:auto 1fr 1fr 1fr auto auto auto;gap:6px;align-items:center}
.chead input{font-weight:700}
.row{margin:6px 0;padding:2px;border-radius:6px}
.row.over{outline:2px dashed var(--blue)}
.items{margin:10px 0}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0;position:sticky;bottom:0;background:var(--bg);padding:10px 0}
#msg{margin:10px 0;font-weight:600}#msg.err{color:var(--red)}
.hint{color:var(--muted);font-size:.9rem}
#login{max-width:340px}
@media (max-width:700px){.chead,.row{grid-template-columns:auto 1fr 1fr auto auto}.chead input:nth-of-type(3),.row input:nth-of-type(3){grid-column:2/4}}
</style>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<main>
  <h1>Admin : ingrédients</h1>
  <div id="login">
    <label for="pw">Mot de passe admin</label>
    <input id="pw" type="password" autocomplete="current-password">
    <p><button id="loginBtn">Entrer</button></p>
  </div>

  <div id="editor" class="hide">
    <p class="hint">Glisse la poignée ⠿ pour réordonner : un ingrédient peut être déposé sur une autre ligne ou sur une autre catégorie, et une catégorie sur une autre catégorie. Sur téléphone, utilise les flèches ↑ ↓. Pas de virgule dans les noms (40 caractères max).</p>
    <div id="cats"></div>
    <div class="bar">
      <button id="addCat" class="ghost">+ Catégorie</button>
      <button id="reset" class="ghost">Liste par défaut</button>
      <button id="save">Enregistrer</button>
    </div>
  </div>
  <div id="msg" role="status" aria-live="polite"></div>
</main>
<script>
const DEFAULT_SHELF = [{"ar": "خضرة وغلة", "fr": "Légumes & fruits", "en": "Vegetables & fruits", "items": [{"ar": "بطاطا", "fr": "pommes de terre", "en": "potatoes"}, {"ar": "طماطم", "fr": "tomates", "en": "tomatoes"}, {"ar": "بصل", "fr": "oignon", "en": "onion"}, {"ar": "ثوم", "fr": "ail", "en": "garlic"}, {"ar": "فلفل", "fr": "poivron", "en": "peppers"}, {"ar": "جزر", "fr": "carottes", "en": "carrots"}, {"ar": "كوسة", "fr": "courgettes", "en": "zucchini"}, {"ar": "باذنجان", "fr": "aubergine", "en": "eggplant"}, {"ar": "قرنابيط", "fr": "chou-fleur", "en": "cauliflower"}, {"ar": "سلاطة", "fr": "laitue", "en": "lettuce"}, {"ar": "ليمون", "fr": "citron", "en": "lemon"}, {"ar": "فطر", "fr": "champignons", "en": "mushrooms"}]}, {"ar": "لحم وحوت", "fr": "Viandes & poissons", "en": "Meat & fish", "items": [{"ar": "دجاج", "fr": "poulet", "en": "chicken"}, {"ar": "لحم مفروم", "fr": "viande hachée", "en": "minced meat"}, {"ar": "لحم علوش", "fr": "agneau", "en": "lamb"}, {"ar": "لحم بقري", "fr": "bœuf", "en": "beef"}, {"ar": "تن", "fr": "thon", "en": "tuna"}, {"ar": "حوت", "fr": "poisson", "en": "fish"}, {"ar": "قمبري", "fr": "crevettes", "en": "shrimp"}, {"ar": "مرڨاز", "fr": "merguez", "en": "merguez"}]}, {"ar": "بيض وحليب", "fr": "Œufs & laitages", "en": "Eggs & dairy", "items": [{"ar": "بيض", "fr": "œufs", "en": "eggs"}, {"ar": "جبن", "fr": "fromage", "en": "cheese"}, {"ar": "حليب", "fr": "lait", "en": "milk"}, {"ar": "زبدة", "fr": "beurre", "en": "butter"}, {"ar": "ياغورت", "fr": "yaourt", "en": "yogurt"}, {"ar": "كريمة", "fr": "crème", "en": "cream"}]}, {"ar": "كرموس وقطاني", "fr": "Féculents & légumineuses", "en": "Grains & legumes", "items": [{"ar": "رز", "fr": "riz", "en": "rice"}, {"ar": "مقرونة", "fr": "pâtes", "en": "pasta"}, {"ar": "سميد", "fr": "semoule", "en": "semolina"}, {"ar": "عدس", "fr": "lentilles", "en": "lentils"}, {"ar": "حمص", "fr": "pois chiches", "en": "chickpeas"}, {"ar": "فاصوليا", "fr": "haricots", "en": "beans"}, {"ar": "خبز", "fr": "pain", "en": "bread"}, {"ar": "فرينة", "fr": "farine", "en": "flour"}]}, {"ar": "توابل وعولة", "fr": "Épices & garde-manger", "en": "Spices & pantry", "items": [{"ar": "هريسة", "fr": "harissa", "en": "harissa"}, {"ar": "كمون", "fr": "cumin", "en": "cumin"}, {"ar": "كروية", "fr": "carvi", "en": "caraway"}, {"ar": "زيتون", "fr": "olives", "en": "olives"}, {"ar": "معجون طماطم", "fr": "concentré de tomate", "en": "tomato paste"}, {"ar": "زيت زيتون", "fr": "huile d’olive", "en": "olive oil"}, {"ar": "سكر", "fr": "sucre", "en": "sugar"}, {"ar": "عسل", "fr": "miel", "en": "honey"}]}];
const $ = id => document.getElementById(id);
let password = '', shelf = [], drag = null;
const ERR = {
  password: 'Mot de passe incorrect.', locked: 'Trop d’essais. Réessaie dans 15 minutes.',
  config: 'ADMIN_PASSWORD n’est pas défini dans Vercel.', storage: 'Redis n’est pas connecté (Vercel > Storage > Upstash).',
  invalid: 'Liste invalide : chaque nom doit être rempli en AR / FR / EN, sans virgule ni < >, 40 caractères max (12 catégories, 40 ingrédients max).',
  server: 'Erreur serveur. Réessaie.'
};
const say = (t, err) => { $('msg').textContent = t; $('msg').className = err ? 'err' : ''; };
const clone = o => JSON.parse(JSON.stringify(o));

async function call(method, body) {
  const r = await fetch('/api/chips' + (method === 'GET' ? '?fresh=1' : ''), {
    method, headers: { 'content-type': 'application/json', 'x-admin-password': password },
    body: body ? JSON.stringify(body) : undefined
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(ERR[d.error] || ERR.server);
  return d;
}

function btn(text, cls, fn, label) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = cls; b.textContent = text; b.onclick = fn;
  if (label) b.setAttribute('aria-label', label);
  return b;
}
function field(obj, l) {
  const i = document.createElement('input');
  i.value = obj[l] || ''; i.maxLength = 40; i.placeholder = l.toUpperCase(); i.setAttribute('aria-label', l);
  if (l === 'ar') i.dir = 'rtl';
  i.oninput = () => { obj[l] = i.value; };
  return i;
}
function grip(kind, ci, ii, host) {
  const g = btn('⠿', 'grip', () => {}, 'Déplacer');
  g.draggable = true;
  g.addEventListener('dragstart', e => {
    drag = { kind, ci, ii };
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', kind);
    e.dataTransfer.setDragImage(host, 12, 12);
    setTimeout(() => host.classList.add('dragging'), 0);
  });
  g.addEventListener('dragend', () => { drag = null; render(); });
  return g;
}
function swap(arr, i, d) { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; render(); }

function moveItemTo(ci, at) {
  const [m] = shelf[drag.ci].items.splice(drag.ii, 1);
  if (drag.ci === ci && drag.ii < at) at--;
  shelf[ci].items.splice(at, 0, m);
}

function itemRow(c, ci, it, ii) {
  const row = document.createElement('div'); row.className = 'row';
  row.addEventListener('dragover', e => { if (drag && drag.kind === 'item') { e.preventDefault(); e.stopPropagation(); row.classList.add('over'); } });
  row.addEventListener('dragleave', () => row.classList.remove('over'));
  row.addEventListener('drop', e => {
    if (!drag || drag.kind !== 'item') return;
    e.preventDefault(); e.stopPropagation();
    const after = e.clientY > row.getBoundingClientRect().top + row.offsetHeight / 2;
    moveItemTo(ci, ii + (after ? 1 : 0)); drag = null; render();
  });
  row.append(grip('item', ci, ii, row), field(it, 'ar'), field(it, 'fr'), field(it, 'en'),
    btn('↑', 'mv', () => swap(c.items, ii, -1), 'Monter'), btn('↓', 'mv', () => swap(c.items, ii, 1), 'Descendre'),
    btn('✕', 'del', () => { c.items.splice(ii, 1); render(); }, 'Supprimer'));
  return row;
}

function catCard(c, ci) {
  const card = document.createElement('section'); card.className = 'cat';
  const head = document.createElement('div'); head.className = 'chead';
  head.append(grip('cat', ci, 0, card), field(c, 'ar'), field(c, 'fr'), field(c, 'en'),
    btn('↑', 'mv', () => swap(shelf, ci, -1), 'Monter'), btn('↓', 'mv', () => swap(shelf, ci, 1), 'Descendre'),
    btn('✕', 'del', () => { if (!c.items.length || confirm('Supprimer cette catégorie et ses ingrédients ?')) { shelf.splice(ci, 1); render(); } }, 'Supprimer'));
  const items = document.createElement('div'); items.className = 'items';
  c.items.forEach((it, ii) => items.appendChild(itemRow(c, ci, it, ii)));
  card.addEventListener('dragover', e => { if (drag) { e.preventDefault(); card.classList.add('over'); } });
  card.addEventListener('dragleave', e => { if (!card.contains(e.relatedTarget)) card.classList.remove('over'); });
  card.addEventListener('drop', e => {
    if (!drag) return;
    e.preventDefault();
    if (drag.kind === 'item') moveItemTo(ci, c.items.length);
    else if (drag.ci !== ci) { const [m] = shelf.splice(drag.ci, 1); shelf.splice(ci, 0, m); }
    drag = null; render();
  });
  card.append(head, items, btn('+ Ingrédient', 'ghost', () => { c.items.push({ ar: '', fr: '', en: '' }); render(); }));
  return card;
}

function render() {
  const box = $('cats'); box.innerHTML = '';
  shelf.forEach((c, ci) => box.appendChild(catCard(c, ci)));
}

$('loginBtn').onclick = async () => {
  password = $('pw').value; say('…');
  try {
    const r = await call('POST', { action: 'login' });
    const d = await call('GET');
    shelf = d.shelf && d.shelf.length ? d.shelf : clone(DEFAULT_SHELF);
    $('login').classList.add('hide'); $('editor').classList.remove('hide');
    render(); say(r.storage ? '' : ERR.storage, !r.storage);
  } catch (e) { say(e.message, true); }
};
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });
$('addCat').onclick = () => { shelf.push({ ar: '', fr: '', en: '', items: [] }); render(); };
$('reset').onclick = () => { shelf = clone(DEFAULT_SHELF); render(); say('Liste par défaut chargée. Clique sur Enregistrer pour la publier.'); };
$('save').onclick = async () => {
  const t = s => (s || '').trim();
  const clean = shelf.map(c => ({
    ar: t(c.ar), fr: t(c.fr), en: t(c.en),
    items: c.items.map(i => ({ ar: t(i.ar), fr: t(i.fr), en: t(i.en) })).filter(i => i.ar || i.fr || i.en)
  })).filter(c => c.ar || c.fr || c.en || c.items.length);
  say('…');
  try {
    const d = await call('POST', { shelf: clean });
    shelf = clean; render();
    say('Enregistré (' + d.count + ' ingrédients). Visible sur le site dans moins d’une minute.');
  } catch (e) { say(e.message, true); }
};
</script>
</body>
</html>
