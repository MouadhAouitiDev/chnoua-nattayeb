<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin – Chnoua nattayeb</title>
<style>
:root{--bg:#f6f9fc;--ink:#12202f;--card:#fff;--line:#d3deea;--blue:#1f4e8c;--blue-ink:#fff;--red:#c4382a;--muted:#546579}
@media (prefers-color-scheme:dark){:root{--bg:#0d1824;--ink:#e8eff7;--card:#14253a;--line:#27405d;--blue:#6aa6ec;--blue-ink:#0d1824;--red:#ff7a68;--muted:#9db1c6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
main{max-width:820px;margin:0 auto;padding:20px}
h1{font-size:1.6rem;margin:.4em 0}
input{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit;width:100%}
button{background:var(--blue);color:var(--blue-ink);border:0;border-radius:6px;padding:9px 14px;cursor:pointer;font:inherit}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.del{background:transparent;color:var(--red);border:1px solid var(--line);padding:6px 10px}
input:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin:6px 0;align-items:center}
.head{color:var(--muted);font-size:.9rem}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
#msg{margin:12px 0;font-weight:600}
#msg.err{color:var(--red)}
#login{max-width:340px}
.hide{display:none}
@media (max-width:640px){.row{grid-template-columns:1fr 1fr;}.row .del{grid-column:span 2}}
</style>
</head>
<body>
<main>
  <h1>Admin : ingrédients rapides</h1>

  <div id="login">
    <label for="pw">Mot de passe admin</label>
    <input id="pw" type="password" autocomplete="current-password">
    <p><button id="loginBtn">Entrer</button></p>
  </div>

  <div id="editor" class="hide">
    <p class="head">Chaque ligne = un ingrédient dans les 3 langues. Pas de virgule dans les noms. Max 60 lignes.</p>
    <div class="row head"><span>العربية</span><span>Français</span><span>English</span><span></span></div>
    <div id="rows"></div>
    <div class="bar">
      <button id="add" class="ghost">+ Ajouter</button>
      <button id="defaults" class="ghost">Remettre la liste par défaut</button>
      <button id="save">Enregistrer</button>
    </div>
  </div>
  <div id="msg" role="status" aria-live="polite"></div>
</main>

<script>
const DEFAULTS = [
  { ar: 'بطاطا', fr: 'pommes de terre', en: 'potatoes' },
  { ar: 'طماطم', fr: 'tomates', en: 'tomatoes' },
  { ar: 'بصل', fr: 'oignon', en: 'onion' },
  { ar: 'ثوم', fr: 'ail', en: 'garlic' },
  { ar: 'فلفل', fr: 'poivron', en: 'peppers' },
  { ar: 'دجاج', fr: 'poulet', en: 'chicken' },
  { ar: 'لحم مفروم', fr: 'viande hachée', en: 'minced meat' },
  { ar: 'بيض', fr: 'œufs', en: 'eggs' },
  { ar: 'تن', fr: 'thon', en: 'tuna' },
  { ar: 'جبن', fr: 'fromage', en: 'cheese' },
  { ar: 'رز', fr: 'riz', en: 'rice' },
  { ar: 'مقرونة', fr: 'pâtes', en: 'pasta' },
  { ar: 'سميد', fr: 'semoule', en: 'semolina' },
  { ar: 'عدس', fr: 'lentilles', en: 'lentils' },
  { ar: 'حمص', fr: 'pois chiches', en: 'chickpeas' },
  { ar: 'خبز', fr: 'pain', en: 'bread' }
];

const $ = id => document.getElementById(id);
let password = '';
let rows = [];

const ERR = {
  password: 'Mot de passe incorrect.',
  locked: 'Trop d’essais. Réessaie dans 15 minutes.',
  config: 'ADMIN_PASSWORD n’est pas défini dans Vercel.',
  storage: 'Le stockage Redis n’est pas connecté (voir le guide).',
  invalid: 'Liste invalide : remplis les 3 langues de chaque ligne, sans virgule ni < >, 40 caractères max.',
  server: 'Erreur serveur. Réessaie.'
};

function say(t, err) { $('msg').textContent = t; $('msg').className = err ? 'err' : ''; }

async function call(method, body) {
  const r = await fetch('/api/chips' + (method === 'GET' ? '?fresh=1' : ''), {
    method,
    headers: { 'content-type': 'application/json', 'x-admin-password': password },
    body: body ? JSON.stringify(body) : undefined
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(ERR[d.error] || ERR.server);
  return d;
}

function readRows() {
  rows = Array.from($('rows').children).map(div => {
    const i = div.querySelectorAll('input');
    return { ar: i[0].value.trim(), fr: i[1].value.trim(), en: i[2].value.trim() };
  });
}

function draw() {
  const box = $('rows');
  box.innerHTML = '';
  rows.forEach((c, idx) => {
    const div = document.createElement('div');
    div.className = 'row';
    ['ar', 'fr', 'en'].forEach(l => {
      const inp = document.createElement('input');
      inp.value = c[l]; inp.maxLength = 40; inp.setAttribute('aria-label', l);
      if (l === 'ar') inp.dir = 'rtl';
      div.appendChild(inp);
    });
    const del = document.createElement('button');
    del.type = 'button'; del.className = 'del'; del.textContent = 'Supprimer';
    del.onclick = () => { readRows(); rows.splice(idx, 1); draw(); };
    div.appendChild(del);
    box.appendChild(div);
  });
}

$('loginBtn').onclick = async () => {
  password = $('pw').value;
  say('…');
  try {
    const r = await call('POST', { action: 'login' });
    const d = await call('GET');
    rows = d.chips && d.chips.length ? d.chips : DEFAULTS.map(x => ({ ...x }));
    $('login').classList.add('hide');
    $('editor').classList.remove('hide');
    draw();
    say(r.storage ? '' : ERR.storage, !r.storage);
  } catch (e) { say(e.message, true); }
};
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });

$('add').onclick = () => { readRows(); rows.push({ ar: '', fr: '', en: '' }); draw(); };
$('defaults').onclick = () => { rows = DEFAULTS.map(x => ({ ...x })); draw(); say('Liste par défaut chargée. Clique sur Enregistrer pour la publier.'); };

$('save').onclick = async () => {
  readRows();
  const chips = rows.filter(c => c.ar || c.fr || c.en);
  say('…');
  try {
    const d = await call('POST', { chips });
    rows = chips; draw();
    say('Enregistré (' + d.count + ' ingrédients). Visible sur le site dans moins d’une minute.');
  } catch (e) { say(e.message, true); }
};
</script>
</body>
</html>
