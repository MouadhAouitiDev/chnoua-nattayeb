<style>
:root{--bg:#f4f8fc;--ink:#12202f;--card:#fff;--line:#cfdcea;--blue:#1b5fae;--blue-ink:#fff;--red:#b3261e;--gold:#b8790a;--muted:#546579;--ok:#2e7d4f;--tilebg:#fbfdff;--wood:#9a6a3a}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
main,footer{max-width:680px;margin:0 auto;padding:20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.langs,#acct{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 12px;border-radius:999px;cursor:pointer;font:inherit}
.pill[aria-pressed="true"]{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
h1{font:700 2.4rem/1.2 Georgia,"Segoe UI",Tahoma,serif;margin:.5em 0 .3em}
.sub{color:var(--muted);margin:0 0 1.2em}
label{font-weight:600}
input,textarea{width:100%;margin-top:6px;padding:12px;border:2px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
textarea{resize:vertical}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;align-items:center}
.chip{transition:transform .12s,background .12s}
.chip:active{transform:scale(.94)}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit}
.btn{width:100%;background:linear-gradient(135deg,var(--red),#e0641f);color:#fff;border:0;border-radius:8px;padding:14px;font:700 1.1rem system-ui,Tahoma,sans-serif;cursor:pointer;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.alt{background:var(--blue);color:var(--blue-ink)}
#msg{margin:14px 0;color:var(--muted)}
#msg.err{color:var(--red);font-weight:600}
#msg small{display:block;font-weight:400;opacity:.75;direction:ltr;text-align:start}
.recipe{background:var(--card);border:1px solid var(--line);border-inline-start:6px solid var(--gold);border-radius:10px;padding:16px 18px;margin:16px 0;animation:up .4s both}
.recipe:nth-child(2){animation-delay:.08s}.recipe:nth-child(3){animation-delay:.16s}
.rh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.recipe h2{margin:0 0 4px;font:700 1.35rem Georgia,"Segoe UI",Tahoma,serif}
.meta{color:var(--muted);font-size:.9rem;margin:0 0 8px}
.recipe h3{font-size:1rem;margin:12px 0 4px}
.recipe ul,.recipe ol{margin:0;padding-inline-start:0;list-style:none}
.recipe li label{display:flex;gap:10px;align-items:flex-start;font-weight:400;cursor:pointer;padding:4px 0}
.recipe li input{width:auto;margin:5px 0 0;accent-color:var(--blue)}
.recipe li.done span{text-decoration:line-through;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:6px;margin:12px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.prog{font-size:.85rem;color:var(--muted);margin:0}
.acts{display:flex;gap:8px;margin-top:10px}
.icon{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:4px 12px;cursor:pointer;font:inherit}
.heart[aria-pressed="true"]{color:var(--red);border-color:var(--red);animation:pop .3s}
.sk{height:130px;background:linear-gradient(90deg,var(--card) 25%,var(--line) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:20px;width:92%;max-width:440px}
dialog.wide{max-width:640px}
dialog::backdrop{background:rgba(0,0,0,.55)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
#authErr{color:var(--red);min-height:1.5em;font-weight:600}
.ad{min-height:90px;border:1px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.85rem;margin:20px 0}
footer{color:var(--muted);font-size:.85rem}
h1::before{content:"🍲";margin-inline-end:.3em}
.tt{display:flex;align-items:center}
.badge{font-size:1.7rem;margin-inline-end:10px}
.saha{font:700 1.15rem Georgia,"Segoe UI",serif;color:var(--ok);margin:8px 0 0;animation:pop .4s}
.scene{position:relative;display:flex;justify-content:center;padding:18px 0 6px;overflow:hidden;color:var(--muted)}
.steam path{stroke-dasharray:60;animation:steam 2s infinite ease-in}
.potg{animation:wob 1.2s infinite ease-in-out;transform-origin:100px 136px}
.fire path{animation:fl .45s infinite alternate;transform-box:fill-box;transform-origin:bottom}
.fire path:nth-child(2){animation-delay:.15s}.fire path:nth-child(3){animation-delay:.3s}
.sp{position:absolute;bottom:30px;font-size:1.6rem;opacity:0;animation:fly 3.2s infinite}
.s1{inset-inline-start:18%}.s2{inset-inline-start:32%;animation-delay:.8s}.s3{inset-inline-end:30%;animation-delay:1.6s}.s4{inset-inline-end:16%;animation-delay:2.2s}
#cookDots{display:flex;gap:6px;justify-content:center;margin:8px 0}
#cookDots i{width:10px;height:10px;border-radius:50%;background:var(--line);transition:transform .2s}
#cookDots i.on{background:var(--red);transform:scale(1.4)}#cookDots i.past{background:var(--ok)}
#cookStep{font-size:1.4rem;line-height:1.6;min-height:6.5em;margin:14px 0}
#cookClock{font:700 2rem ui-monospace,monospace;color:var(--red);text-align:center;min-height:1.5em}
@keyframes steam{0%{opacity:0;transform:translateY(10px)}50%{opacity:.8}100%{opacity:0;transform:translateY(-14px)}}
@keyframes wob{50%{transform:rotate(-1.5deg)}}
@keyframes fl{to{transform:scale(.9,1.25)}}
@keyframes fly{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(-90px) rotate(30deg)}}
main,footer{position:relative;z-index:1}
h1::before{display:inline-block;animation:wig 2.6s ease-in-out infinite}
.pill.chip:hover{transform:translateY(-2px)}
.chip[aria-pressed="true"]{animation:pop .25s}
.recipe{position:relative;transition:transform .2s,box-shadow .2s}
.recipe:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.14)}
#go:not(:disabled){animation:glow 2.4s infinite}
.boom{position:absolute;inset-inline-start:50%;top:40%;font-size:1.5rem;pointer-events:none;animation:boom .9s ease-out forwards}
@keyframes wig{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes glow{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--red) 22%,transparent)}}
@keyframes boom{to{transform:translate(var(--x),var(--y)) scale(1.3);opacity:0}}
.kitchen{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:var(--bg)}
.kitchen svg{width:100%;height:100%;display:block}
.kitchen::after{content:"";position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 14%,transparent)}
main{background:color-mix(in srgb,var(--bg) 64%,transparent);backdrop-filter:blur(4px);border-radius:14px;margin-top:10px}
.sway{transform-box:fill-box;transform-origin:top center;animation:sway 4.5s ease-in-out infinite}
.k-steam{color:var(--muted)}
.k-steam path{stroke-dasharray:70;animation:steam 3s infinite ease-in}
.k-fire path{animation:fl .45s infinite alternate;transform-box:fill-box;transform-origin:bottom}
.k-fire path:nth-child(2){animation-delay:.15s}.k-fire path:nth-child(3){animation-delay:.3s}
.sun{transform-box:fill-box;transform-origin:center;animation:sunp 3.5s ease-in-out infinite}
.lid{animation:lid 1.3s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes sunp{50%{transform:scale(1.14)}}
@keyframes lid{50%{transform:translateY(-3px)}}
.kitchen video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:0;transition:opacity 1.2s}
.kitchen video.on{opacity:1}
.kitchen.vid::after{background:color-mix(in srgb,var(--bg) 10%,transparent)}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{50%{transform:scale(1.25)}}
@keyframes sh{to{background-position:-200% 0}}

}
@media (max-width: 380px) {
  main, footer { padding: 11px; }
  .langs .pill { font-size: .82rem; }
  h1 { font-size: 1.75rem; }
  .recipe { padding: 12px; }
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const QUICK_DEFAULT = [
  {ar:'بطاطا',fr:'pommes de terre',en:'potatoes'},{ar:'طماطم',fr:'tomates',en:'tomatoes'},{ar:'بصل',fr:'oignon',en:'onion'},
  {ar:'ثوم',fr:'ail',en:'garlic'},{ar:'فلفل',fr:'poivron',en:'peppers'},{ar:'دجاج',fr:'poulet',en:'chicken'},
  {ar:'لحم مفروم',fr:'viande hachée',en:'minced meat'},{ar:'بيض',fr:'œufs',en:'eggs'},{ar:'تن',fr:'thon',en:'tuna'},
  {ar:'جبن',fr:'fromage',en:'cheese'},{ar:'رز',fr:'riz',en:'rice'},{ar:'مقرونة',fr:'pâtes',en:'pasta'},
  {ar:'سميد',fr:'semoule',en:'semolina'},{ar:'عدس',fr:'lentilles',en:'lentils'},{ar:'حمص',fr:'pois chiches',en:'chickpeas'},{ar:'خبز',fr:'pain',en:'bread'}
];
let QUICK = QUICK_DEFAULT;

const $ = id => document.getElementById(id);
const ing = $('ing'), chips = $('chips'), go = $('go'), msg = $('msg'), results = $('results');
let lang = 'fr', user = null, favs = [], storage = false, authMode = 'login', tipTimer = null;
const t = () => T[lang];

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text != null) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}
function say(text, err, detail) {
  msg.className = err ? 'err' : '';
  msg.textContent = text;
  if (detail) msg.appendChild(el('small', detail));
}
async function api(action, data) {
  const r = await fetch('/api/auth', { method: 'POST', headers: {'content-type':'application/json'}, body: JSON.stringify({ action, ...data }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'server');
  return d;
}

/* ---------- chips ---------- */
const list = () => ing.value.split(/[,،\n]/).map(s => s.trim()).filter(Boolean);
function syncChips() {
  const items = list().map(x => x.toLowerCase());
  chips.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(items.includes(c.textContent.toLowerCase()))));
}
function buildChips() {
  chips.innerHTML = '';
  QUICK.forEach(q => {
    const name = q[lang];
    const b = el('button', name, 'pill chip');
    b.type = 'button'; b.setAttribute('aria-pressed', 'false');
    b.onclick = () => {
      const items = list();
      const i = items.findIndex(x => x.toLowerCase() === name.toLowerCase());
      if (i >= 0) items.splice(i, 1); else items.push(name);
      ing.value = items.join(lang === 'ar' ? '، ' : ', ');
      syncChips();
    };
    chips.appendChild(b);
  });
  syncChips();
}
ing.addEventListener('input', syncChips);
$('clear').onclick = () => { ing.value = ''; syncChips(); };

/* ---------- recipe card ---------- */
function recipeText(r) {
  return [r.nom, '', ...(r.en_plus || []).map(x => '• ' + x), '', ...(r.etapes || []).map((x, i) => (i + 1) + '. ' + x), '', location.origin].join('\n');
}
function card(r) {
  const c = el('article', null, 'recipe');
  const head = el('div', null, 'rh');
  const tt = el('div', null, 'tt'); tt.append(el('span', dishIcon(r.nom || ''), 'badge'), el('h2', r.nom || '')); head.appendChild(tt);
  const heart = el('button', '♥', 'icon heart');
  heart.type = 'button'; heart.dataset.nom = r.nom; heart.setAttribute('aria-label', t().save); heart.setAttribute('aria-pressed', 'false');
  heart.onclick = () => toggleFav(r);
  head.appendChild(heart);
  c.appendChild(head);
  const meta = [r.authentique === false ? '✨ ' + t().insp : '✔ ' + t().trad, r.temps, r.portions].filter(Boolean).join(' · ');
  if (meta) c.appendChild(el('p', meta, 'meta'));

  const checkList = (items, ordered) => {
    const l = el(ordered ? 'ol' : 'ul');
    items.forEach(x => {
      const li = el('li'), lab = el('label'), cb = el('input');
      cb.type = 'checkbox';
      cb.onchange = () => { li.classList.toggle('done', cb.checked); if (ordered) updateProgress(); };
      lab.append(cb, el('span', String(x)));
      li.appendChild(lab); l.appendChild(li);
    });
    return l;
  };
  if (Array.isArray(r.en_plus) && r.en_plus.length) { c.appendChild(el('h3', t().extra)); c.appendChild(checkList(r.en_plus, false)); }
  let updateProgress = () => {};
  if (Array.isArray(r.etapes) && r.etapes.length) {
    c.appendChild(el('h3', t().steps));
    const ol = checkList(r.etapes, true);
    const bar = el('div', null, 'bar'), fill = el('i'), prog = el('p', null, 'prog'), saha = el('p', null, 'saha');
    bar.appendChild(fill);
    updateProgress = () => {
      const n = ol.querySelectorAll('input:checked').length, N = r.etapes.length;
      fill.style.width = (n / N * 100) + '%';
      prog.textContent = n + '/' + N + ' ' + t().done;
      saha.textContent = n === N ? t().saha : '';
      if (n === N && !c.dataset.done) { c.dataset.done = '1'; burst(c); } if (n < N) delete c.dataset.done;
    };
    c.append(ol, bar, prog, saha);
    updateProgress();
  }
  const acts = el('div', null, 'acts');
  const cp = el('button', t().copy, 'icon'); cp.type = 'button';
  cp.onclick = async () => {
    try {
      if (navigator.share) await navigator.share({ title: r.nom, text: recipeText(r) });
      else { await navigator.clipboard.writeText(recipeText(r)); cp.textContent = t().copied; setTimeout(() => cp.textContent = t().copy, 1500); }
    } catch (e) {}
  };
  if (r.etapes && r.etapes.length) { const ck = el('button', '👨‍🍳 ' + t().cook, 'icon'); ck.type = 'button'; ck.onclick = () => openCook(r); acts.appendChild(ck); }
  acts.appendChild(cp); c.appendChild(acts);
  return c;
}

/* ---------- Tunisian kitchen touches ---------- */
const ICONS = [
  [/couscous|كسكسي|كسكس|kosksi/i, '🍲'], [/brik|بريك/i, '🥟'],
  [/ojja|عجة|chakchouka|شكشوكة|بيض|œuf|egg/i, '🍳'], [/salade|slata|سلاطة|mechouia|مشوية/i, '🥗'],
  [/lablabi|لبلابي|marqa|مرقة|مرڨة|soupe|chorba|شربة|soup|hlalem|حلالم/i, '🥣'],
  [/pâte|pasta|مقرونة|مكرونة|spaghetti/i, '🍝'], [/poulet|دجاج|chicken|djej/i, '🍗'],
  [/poisson|حوت|fish|thon|تن/i, '🐟'], [/tajine|طاجين/i, '🥘'], [/fricass|فريكاسي|pain|خبز|bread|sandwich/i, '🥖'],
  [/riz|رز|rice/i, '🍚'], [/makroudh|مقروض|gâteau|cake/i, '🍯']
];
const dishIcon = n => (ICONS.find(([re]) => re.test(n)) || [0, '🍽️'])[1];

function burst(card) {
  ['✨', '🌶️', '🍋', '🌿', '🎉', '✨', '🧄', '🍅'].forEach(e => {
    const s = el('span', e, 'boom');
    s.style.setProperty('--x', (Math.random() * 260 - 130) + 'px');
    s.style.setProperty('--y', (Math.random() * -170 - 20) + 'px');
    card.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  });
}

function scene() {
  const d = el('div', null, 'scene');
  d.setAttribute('aria-hidden', 'true');
  d.innerHTML = '<div class="sp s1">🌶️</div><div class="sp s2">🧄</div><div class="sp s3">🍋</div><div class="sp s4">🌿</div>' +
    '<svg viewBox="0 0 200 170" width="220" height="187">' +
    '<g class="steam" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"><path d="M80 52c-10-12 10-18 0-32"/><path d="M100 52c-10-12 10-18 0-32" style="animation-delay:.5s"/><path d="M120 52c-10-12 10-18 0-32" style="animation-delay:1s"/></g>' +
    '<g class="potg"><path d="M45 70h110l-8 52a16 16 0 0 1-16 14H69a16 16 0 0 1-16-14z" fill="var(--blue)"/><rect x="38" y="60" width="124" height="14" rx="7" fill="var(--gold)"/><circle cx="100" cy="54" r="7" fill="var(--gold)"/>' +
    '<path d="M45 85c-16 0-16 22 0 22M155 85c16 0 16 22 0 22" fill="none" stroke="var(--blue)" stroke-width="6" stroke-linecap="round"/><path d="M62 92h76M64 106h72" stroke="var(--card)" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/></g>' +
    '<g class="fire"><path d="M70 160c-8-14 6-18 2-30 12 8 14 20 8 30z" fill="var(--red)"/><path d="M100 160c-8-14 6-18 2-30 12 8 14 20 8 30z" fill="var(--gold)"/><path d="M130 160c-8-14 6-18 2-30 12 8 14 20 8 30z" fill="var(--red)"/></g></svg>';
  return d;
}

let cookR = null, cookI = 0, clock = null;
function stopClock() { clearInterval(clock); clock = null; $('cookClock').textContent = ''; }
function startClock(sec) {
  stopClock();
  const tick = () => {
    if (sec < 0) { stopClock(); $('cookClock').textContent = t().ready; try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) {} return; }
    $('cookClock').textContent = String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
    sec--;
  };
  tick(); clock = setInterval(tick, 1000);
}
function drawCook() {
  stopClock();
  const steps = cookR.etapes, i = cookI;
  $('cookStep').textContent = steps[i];
  const dots = $('cookDots'); dots.innerHTML = '';
  steps.forEach((_, k) => dots.appendChild(el('i', null, k === i ? 'on' : (k < i ? 'past' : ''))));
  $('cookPrev').disabled = i === 0;
  $('cookNext').textContent = i === steps.length - 1 ? t().finish : t().next;
  const m = steps[i].match(/(\d+)\s*(min|mn|minutes?|دقيقة|دقايق|د)(?![\p{L}])/iu);
  const tb = $('cookTimer'); tb.hidden = !m;
  if (m) { tb.textContent = '⏱ ' + t().timer + ' (' + m[1] + ' min)'; tb.onclick = () => startClock(Number(m[1]) * 60); }
}
function openCook(r) { cookR = r; cookI = 0; $('cookTitle').textContent = (dishIcon(r.nom || '')) + ' ' + (r.nom || ''); drawCook(); $('cookDlg').showModal(); }
$('cookPrev').onclick = () => { if (cookI > 0) { cookI--; drawCook(); } };
$('cookNext').onclick = () => { if (cookI < cookR.etapes.length - 1) { cookI++; drawCook(); } else $('cookDlg').close(); };
$('cookDlg').addEventListener('close', stopClock);

/* ---------- favorites ---------- */
function refreshHearts() {
  document.querySelectorAll('.heart').forEach(h => h.setAttribute('aria-pressed', String(favs.some(f => f.nom === h.dataset.nom))));
}
function renderFavs() {
  const box = $('favList'); box.innerHTML = '';
  if (!favs.length) box.appendChild(el('p', t().nofavs, 'sub'));
  favs.forEach(f => box.appendChild(card(f)));
  refreshHearts();
}
async function toggleFav(r) {
  if (!user) { openAuth('login', t().err.login); return; }
  try {
    const ex = favs.find(f => f.nom === r.nom);
    favs = (ex ? await api('fav_remove', { id: ex.id }) : await api('fav_add', { recipe: r })).favs;
    if ($('favDlg').open) renderFavs(); else refreshHearts();
  } catch (e) { say(t().err[e.message] || t().err.server, true); }
}

/* ---------- account ---------- */
function renderAcct() {
  const box = $('acct'); box.innerHTML = '';
  if (!storage) return;
  if (!user) { const b = el('button', t().login, 'pill'); b.onclick = () => openAuth('login'); box.appendChild(b); return; }
  const f = el('button', '♥ ' + t().favs, 'pill'); f.onclick = () => { renderFavs(); $('favDlg').showModal(); };
  const o = el('button', t().logout, 'pill');
  o.onclick = async () => { try { await api('logout'); } catch (e) {} user = null; favs = []; renderAcct(); refreshHearts(); };
  box.append(f, o);
}
function setAuthMode(m) {
  authMode = m;
  $('tabLogin').setAttribute('aria-pressed', String(m === 'login'));
  $('tabSignup').setAttribute('aria-pressed', String(m === 'signup'));
  $('authGo').textContent = m === 'login' ? t().login : t().signup;
  $('authPw').autocomplete = m === 'login' ? 'current-password' : 'new-password';
}
function openAuth(mode, note) {
  setAuthMode(mode);
  $('authErr').textContent = note || '';
  $('authDlg').showModal();
}
$('tabLogin').onclick = () => setAuthMode('login');
$('tabSignup').onclick = () => setAuthMode('signup');
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => $(b.dataset.close).close());
$('authForm').onsubmit = async e => {
  e.preventDefault();
  $('authErr').textContent = '';
  try {
    const d = await api(authMode === 'login' ? 'login' : 'register', { email: $('authEmail').value, password: $('authPw').value });
    user = d.user;
    favs = (await api('fav_list')).favs;
    $('authPw').value = '';
    $('authDlg').close();
    renderAcct(); refreshHearts();
  } catch (err) { $('authErr').textContent = t().err[err.message] || t().err.server; }
};

/* ---------- language ---------- */
function initialLang() {
  try { const s = localStorage.getItem('lang'); if (T[s]) return s; } catch (e) {}
  const n = (navigator.language || 'fr').slice(0, 2);
  return T[n] ? n : 'fr';
}
function setLang(l) {
  lang = l;
  try { localStorage.setItem('lang', l); } catch (e) {}
  document.documentElement.lang = l === 'ar' ? 'ar-TN' : l;
  document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  document.title = t().page;
  $('metaDesc').setAttribute('content', t().desc);
  document.querySelectorAll('[data-t]').forEach(e => e.textContent = t()[e.dataset.t]);
  ing.placeholder = t().ph;
  go.textContent = t().go;
  chips.setAttribute('aria-label', t().chipsLbl);
  document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === l)));
  setAuthMode(authMode);
  say('', false); results.innerHTML = ''; ing.value = '';
  buildChips(); renderAcct();
}
document.querySelectorAll('.langs button').forEach(b => b.onclick = () => setLang(b.dataset.lang));

/* ---------- generate ---------- */
go.onclick = async () => {
  const text = list().join(', ');
  results.innerHTML = '';
  if (text.length < 3) { say(t().need, true); return; }
  go.disabled = true;
  results.appendChild(scene());
  let ti = 0;
  say(t().tips[0], false);
  tipTimer = setInterval(() => say(t().tips[++ti % t().tips.length], false), 2500);
  try {
    const r = await fetch('/api/chnoua', { method: 'POST', headers: {'content-type':'application/json'}, body: JSON.stringify({ ingredients: text, lang }) });
    const d = await r.json().catch(() => ({}));
    results.innerHTML = '';
    if (!r.ok) {
      let key = d.error;
      if (key === 'quota') key = !d.storage ? 'rate' : (d.member ? 'quotaMember' : 'quotaGuest');
      say(t().err[key] || t().err.server, true, d.detail);
      return;
    }
    if (!d.recettes || !d.recettes.length) { say(t().empty, false); return; }
    say('', false);
    d.recettes.forEach(x => results.appendChild(card(x)));
    const more = el('button', t().another, 'btn alt'); more.onclick = () => go.click();
    results.appendChild(more);
    refreshHearts();
  } catch (e) {
    results.innerHTML = ''; say(t().err.network, true);
  } finally {
    clearInterval(tipTimer); go.disabled = false;
  }
};

/* ---------- background video ----------
   Tries /media/kitchen.mp4 first (your own compressed copy), then a free Pexels CDN clip.
   The CDN clip is heavy (UHD), so it only plays on large screens with a good connection. */
(() => {
  const ALLOW_MOBILE = true; // allow the fullscreen background video on mobile too
  const v = $('bgVideo');
  if (!v) return;
  const c = navigator.connection;
  const weak = c && (c.saveData || /(^|-)(2g|3g)/.test(c.effectiveType || ''));
  const small = matchMedia('(max-width: 899px)').matches;
  if (weak || matchMedia('(prefers-reduced-motion: reduce)').matches) { v.remove(); return; }
  v.addEventListener('playing', () => { v.classList.add('on'); v.parentElement.classList.add('vid'); });
  addEventListener('load', () => { v.preload = 'auto'; v.load(); v.play().catch(() => {}); });
})();

/* ---------- boot ---------- */
setLang(initialLang());
fetch('/api/chips').then(r => r.ok ? r.json() : null).then(d => {
  if (d && Array.isArray(d.chips) && d.chips.length) { QUICK = d.chips; buildChips(); }
}).catch(() => {});
fetch('/api/auth').then(r => r.json()).then(async d => {
  storage = Boolean(d.storage); user = d.user || null;
  if (user) { try { favs = (await api('fav_list')).favs; } catch (e) {} }
  renderAcct(); refreshHearts();
